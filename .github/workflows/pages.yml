# main'e her push'ta: birim testleri, tip denetimi ve derleme; hepsi geçerse GitHub Pages'e yayın.
# Uzun tarayıcı turları (npm run e2e, e2e:prologue) burada koşmaz; yerelde çalıştırılır.
name: Test ve yayın

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Birim testleri
        run: npm test
      - name: Tip denetimi ve derleme
        run: npm run build
      - name: Geliştirme kancaları yayında olmamalı
        run: |
          if grep -q "__dm" dist/assets/*.js; then echo "window.__dm yayın derlemesinde"; exit 1; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
